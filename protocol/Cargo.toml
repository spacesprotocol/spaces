[package]
name = "spaces_protocol"
description = "Core protocol types and consensus rules for the Spaces Protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bitcoin = { version = "0.32.8", features = ["base64", "serde"], default-features = false }

## optional features
borsh = { version = "1.5", default-features = false, features = ["derive"], optional = true }
borsh_utils = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"], default-features = false, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
serde = ["dep:serde"]
borsh = ["dep:borsh", "dep:borsh_utils"]
std = ["serde", "borsh"]
