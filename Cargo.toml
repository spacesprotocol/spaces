[workspace]
resolver = "2"
members = ["borsh_utils", "client", "protocol", "testutil", "wallet", "nums", "sip7"]

[workspace.dependencies]
anyhow = "1.0"
hex = "0.4"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
spacedb = { git = "https://github.com/spacesprotocol/spacedb", version = "0.0.11" }
base64 = "0.22"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
jsonrpsee = { version = "0.22", features = ["server", "http-client", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
threadpool = "1.8"
tabled = "0.17"
colored = "3.0"
tower = "0.4"
hyper = "0.14"
secp256k1 = "0.29"
bech32 = "0.11"
bdk_wallet = { git = "https://github.com/buffrr/bdk.git", rev = "43bca8643dec6fdda99e4a29bf88709729af349e", features = ["keys-bip39", "rusqlite"] }

# Dev/test dependencies
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
bitcoind = { version = "0.36.0", features = ["26_0"] }
zip = "0.6"

