[workspace]
resolver = "2"
members = ["borsh_utils", "checkpoint", "client", "protocol", "testutil", "wallet", "nums", "sip7"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/spacesprotocol/spaces"
homepage = "https://spacesprotocol.org"
authors = ["Buffrr <contact@buffrr.dev>"]

[workspace.dependencies]
# Internal crates
borsh_utils = { path = "borsh_utils", version = "0.3.1", default-features = false }
spaces_protocol = { path = "protocol", version = "0.3.1", default-features = false }
spaces_nums = { path = "nums", version = "0.3.1", default-features = false }
sip7 = { path = "sip7", version = "0.3.1", default-features = false }
spaces_wallet = { path = "wallet", version = "0.3.1", default-features = false }
spaces_client = { path = "client", version = "0.3.1", default-features = false }
spaces_testutil = { path = "testutil", default-features = false }

# External
anyhow = "1.0"
hex = "0.4"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
spacedb = { version = "0.1.4", features = ["hash-idx"] }
base64 = "0.22"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
jsonrpsee = { version = "0.22", features = ["server", "http-client", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
threadpool = "1.8"
tabled = "0.17"
colored = "3.0"
tower = "0.4"
hyper = "0.14"
secp256k1 = "0.29"
bech32 = "0.11"
# temporary backport of bdk for the double-spend issue until we migrate to bdk v3.0
bdk_wallet = { package = "bdk_wallet_backport", version = "1.0.0-beta.6", features = ["keys-bip39", "rusqlite"] }

# Dev/test dependencies
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
bitcoind = { version = "0.36.0", features = ["26_0"] }
zip = "0.6"

