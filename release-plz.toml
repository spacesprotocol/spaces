[[package]]
name = "spaces_nums"
publish = true
git_release_enable = true
git_release_latest = false
git_tag_name = "spaces_nums-v{{ version }}"

[[package]]
name = "sip7"
publish = true
git_release_enable = true
git_release_latest = false
git_tag_name = "sip7-v{{ version }}"

[[package]]
name = "spaces_wallet"
publish = true
git_release_enable = true
git_release_latest = false
git_tag_name = "spaces_wallet-v{{ version }}"

[[package]]
name = "spaces_client"
publish = true
git_release_enable = true
git_release_latest = false
git_tag_name = "spaces_client-v{{ version }}"
git_release_body = """
> ⚠️ **Subspaces preview — for mainnet alpha testing.**
>
> This release is built from the `subspaces` branch and ships new protocol changes. If you are running a production mainnet node, continue using the latest `v0.0.9a` release from the `main` branch:
> https://github.com/spacesprotocol/spaces/releases/tag/v0.0.9a

{{ changelog }}
"""

[[package]]
name = "spaces_checkpoint"
publish = true
git_release_enable = true
git_release_latest = false
git_tag_name = "spaces_checkpoint-v{{ version }}"

# Internal test-only crate; never released.
[[package]]
name = "spaces_testutil"
release = false
publish = false