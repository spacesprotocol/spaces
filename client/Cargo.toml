[package]
name = "spaces_client"
description = "Spaces client (spaced) and CLI (space-cli) for the Spaces Protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "space-cli"
path = "src/bin/space-cli.rs"

[[bin]]
name = "spaced"
path = "src/bin/spaced.rs"

[[bin]]
name = "rpc-docs"
path = "src/bin/rpc-docs.rs"
required-features = ["schema"]

[lib]
path = "src/lib.rs"

[dependencies]
spaces_wallet = { workspace = true }
spaces_protocol = { workspace = true, features = ["std"] }
spaces_nums = { workspace = true, features = ["std"] }
sip7 = { workspace = true, features = ["serde"] }
spacedb = { workspace = true }
borsh_utils = { workspace = true }

tokio = { workspace = true, features = ["signal"] }
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
hex = { workspace = true }
rand = { workspace = true }
jsonrpsee = { workspace = true }
directories = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
borsh = { version = "1.5", features = ["derive"] }
base64 = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
threadpool = { workspace = true }
tabled = { workspace = true }
colored = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
schemars = { version = "0.8", optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
schema = ["schemars"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
spaces_testutil = { workspace = true }
