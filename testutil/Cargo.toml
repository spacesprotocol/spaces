[package]
name = "spaces_testutil"
description = "Internal test utilities for the Spaces project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "db-dump"
path = "src/bin/db_dump.rs"

[dependencies]
bitcoind = { workspace = true }
spaces_client = { workspace = true }
assert_cmd = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
spacedb = { workspace = true }
spaces_protocol = { workspace = true, features = ["std", "serde"] }
borsh = { version = "1.5", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
zip = { workspace = true }
anyhow = { workspace = true }
